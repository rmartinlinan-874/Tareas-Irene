// =====================================================================
// Conexión con Firebase + sustituto de "window.storage"
// (la app original usaba window.storage, propio de los artifacts de
// Claude; aquí lo reimplementamos con Firebase Realtime Database para
// que los datos se compartan entre dispositivos)
// =====================================================================
let dbReady = false;
let dbError = null;
let db = null;
try {
  if (window.FIREBASE_CONFIG.apiKey.startsWith("PEGA_AQUI")) {
    dbError = "CONFIG_MISSING";
  } else {
    firebase.initializeApp(window.FIREBASE_CONFIG);
    db = firebase.database();
    dbReady = true;
  }
} catch (e) {
  dbError = e.message;
}

function sanitizeKey(key) {
  return String(key).replace(/[.#$/\[\]]/g, "_");
}

window.storage = {
  get: async (key) => {
    if (!dbReady) throw new Error("DB not ready");
    const snap = await db.ref("data/" + sanitizeKey(key)).once("value");
    if (!snap.exists()) return null;
    return { key, value: snap.val() };
  },
  set: async (key, value) => {
    if (!dbReady) throw new Error("DB not ready");
    await db.ref("data/" + sanitizeKey(key)).set(value);
    return { key, value };
  },
};

// =====================================================================
// A partir de aquí: la app original, sin cambios de lógica salvo lo
// señalado en los comentarios "CORRECCIÓN"
// =====================================================================

const PLAYER_NAME = 'Irene';

// CORRECCIÓN: la semana ahora empieza en sábado, así que el orden de los
// días (y de sus letras/nombres) cambia: S, D, L, M, X, J, V.
const DAY_LETTERS = ['S', 'D', 'L', 'M', 'X', 'J', 'V'];
const DAY_FULL = ['Sábado', 'Domingo', 'Lunes', 'Martes', 'Miércoles', 'Jueves', 'Viernes'];
const MONTHS = ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'];

const EXTRA_TASKS = [
  { key: 'basura', label: 'Bajar la basura', points: 0.5 },
  { key: 'recoger', label: 'Recoger ropa tendida', points: 1 },
  { key: 'barrer', label: 'Barrer y fregar otra estancia', points: 1 },
];

const BASE_PAY = 10;
const EXTRA_GOAL = 5;
const EXTRA_BONUS = 5;
const FAIL_LIMIT = 3;
const AVISOS_LIMIT = 5;

function pad(n) { return n < 10 ? '0' + n : '' + n; }

// CORRECCIÓN: antes devolvía el lunes de la semana; ahora devuelve el
// sábado (el primer día de la semana en la app), retrocediendo hasta el
// sábado más reciente.
function getWeekStart(d) {
  const date = new Date(d);
  const day = date.getDay(); // 0=domingo … 6=sábado
  const diff = -((day + 1) % 7);
  date.setDate(date.getDate() + diff);
  date.setHours(0, 0, 0, 0);
  return date;
}

function addDays(date, n) {
  const d = new Date(date);
  d.setDate(d.getDate() + n);
  return d;
}

function getISOWeek(date) {
  const d = new Date(Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()));
  const dayNum = d.getUTCDay() || 7;
  d.setUTCDate(d.getUTCDate() + 4 - dayNum);
  const yearStart = new Date(Date.UTC(d.getUTCFullYear(), 0, 1));
  const weekNo = Math.ceil((((d - yearStart) / 86400000) + 1) / 7);
  return { week: weekNo, year: d.getUTCFullYear() };
}

// CORRECCIÓN: antes la clave de guardado usaba el número de semana ISO
// (pensado para semanas que empiezan en lunes). Como ahora la semana
// empieza en sábado, esa numeración ya no encaja con los días mostrados
// y podría mezclar datos con las semanas antiguas guardadas con el
// esquema anterior. Para evitarlo, la clave nueva usa directamente la
// fecha del sábado con el que empieza la semana (p.ej. "2026-09-26"),
// que no choca con ninguna clave "2026-Wxx" ya guardada.
function weekKeyFromStart(weekStart) {
  const y = weekStart.getFullYear();
  const m = pad(weekStart.getMonth() + 1);
  const d = pad(weekStart.getDate());
  return `${y}-${m}-${d}`;
}

function isCajonWeek(weekStart) {
  const { week } = getISOWeek(weekStart);
  return week % 2 === 0;
}

function formatShort(date) {
  return `${date.getDate()} ${MONTHS[date.getMonth()]}`;
}

function emptyTask7() {
  return { proposed: Array(7).fill(false), confirmed: Array(7).fill(false) };
}

// CORRECCIÓN: cama y ropa se dan por cumplidas cada día. Solo se guardan los
// FALLOS: los días que el padre ha desmarcado.
function emptyFails7() {
  return Array(7).fill(false);
}

function normalizeFails(rawFail, legacyTask, pastDays) {
  if (Array.isArray(rawFail)) return Array.from({ length: 7 }, (_, i) => !!rawFail[i]);
  // Semana guardada con el sistema anterior (proposed/confirmed): los días ya
  // pasados que no estaban confirmados pasan a contar como fallo, para que
  // el recibo de esa semana no cambie.
  if (legacyTask && Array.isArray(legacyTask.confirmed)) {
    return Array.from({ length: 7 }, (_, i) => i < pastDays && !legacyTask.confirmed[i]);
  }
  return emptyFails7();
}

// CORRECCIÓN: la tarea "libre" ahora es un contador propuesto/confirmado,
// igual que el resto de tareas, en vez de un número que cualquiera podía tocar.
function emptyLibreCounter() {
  return { proposed: 0, confirmed: 0 };
}

function emptyWeekData() {
  return {
    camaFail: emptyFails7(),
    ropaFail: emptyFails7(),
    cuarto: { proposed: false, confirmed: false },
    cajon: { proposed: false, confirmed: false },
    avisosLavavajillas: 0,
    extras: {
      basura: emptyTask7(),
      recoger: emptyTask7(),
      barrer: emptyTask7(),
      libre: emptyLibreCounter(),
    },
  };
}

function normalizeTask(t) {
  const empty = emptyTask7();
  if (!t || !Array.isArray(t.proposed) || !Array.isArray(t.confirmed)) return empty;
  const fix = (arr) => Array.from({ length: 7 }, (_, i) => !!arr[i]);
  return { proposed: fix(t.proposed), confirmed: fix(t.confirmed) };
}

// CORRECCIÓN: normaliza el nuevo contador y también migra el formato
// antiguo (un simple número) para no perder datos ya guardados: si
// encuentra el número viejo, lo trata como "confirmado" (ya sumaba al
// bono) y deja "propuesto" igualado, para que no aparezca como pendiente.
function normalizeLibreCounter(raw) {
  if (typeof raw === 'number' && Number.isFinite(raw)) {
    const n = Math.max(0, raw);
    return { proposed: n, confirmed: n };
  }
  if (raw && typeof raw === 'object') {
    const proposed = typeof raw.proposed === 'number' ? Math.max(0, raw.proposed) : 0;
    const confirmed = typeof raw.confirmed === 'number' ? Math.max(0, raw.confirmed) : 0;
    return { proposed, confirmed };
  }
  return emptyLibreCounter();
}

function normalizeWeekData(raw, pastDays = 0) {
  const base = emptyWeekData();
  if (!raw || typeof raw !== 'object') return base;
  const extras = raw.extras || {};
  return {
    camaFail: normalizeFails(raw.camaFail, raw.cama, pastDays),
    ropaFail: normalizeFails(raw.ropaFail, raw.ropa, pastDays),
    cuarto: raw.cuarto ? { proposed: !!raw.cuarto.proposed, confirmed: !!raw.cuarto.confirmed } : base.cuarto,
    cajon: raw.cajon ? { proposed: !!raw.cajon.proposed, confirmed: !!raw.cajon.confirmed } : base.cajon,
    avisosLavavajillas: typeof raw.avisosLavavajillas === 'number' ? raw.avisosLavavajillas : 0,
    extras: {
      basura: normalizeTask(extras.basura),
      recoger: normalizeTask(extras.recoger),
      barrer: normalizeTask(extras.barrer),
      libre: normalizeLibreCounter(extras.libre),
    },
  };
}

function Cell({ proposed, confirmed, onClick, ariaLabel, sublabel }) {
  const state = confirmed ? 'confirmed' : proposed ? 'proposed' : 'empty';
  return (
    <button
      type="button"
      onClick={onClick}
      aria-pressed={confirmed}
      aria-label={ariaLabel}
      className={`gt-cell gt-cell--${state}`}
    >
      <span className="gt-cell__mark">
        {state === 'confirmed' && <Check size={14} strokeWidth={3} />}
        {state === 'proposed' && <span className="gt-cell__dot" />}
      </span>
      {state === 'empty' && <span className="gt-cell__letter">{sublabel}</span>}
    </button>
  );
}

function Lives({ failCount, limit }) {
  const alive = Math.max(0, limit - failCount);
  return (
    <div className="gt-lives">
      {Array.from({ length: limit }).map((_, i) => (
        <Heart
          key={i}
          size={17}
          strokeWidth={1.6}
          fill={i < alive ? '#FF6F5E' : 'none'}
          color={i < alive ? '#FF6F5E' : '#E3AE78'}
        />
      ))}
    </div>
  );
}

function BancoDeMisiones() {
  const [weekOffset, setWeekOffset] = useState(0);
  const [weekData, setWeekData] = useState(null);
  const [mode, setMode] = useState('hija');
  const [confirmReset, setConfirmReset] = useState(false);
  const [storedPin, setStoredPin] = useState(null);
  const [pinLoaded, setPinLoaded] = useState(false);
  const [pinStage, setPinStage] = useState(null); // null | 'create' | 'enter'
  const [pinValue, setPinValue] = useState('');
  const [pinValue2, setPinValue2] = useState('');
  const [pinError, setPinError] = useState('');
  const loadTokenRef = useRef(0);
  // Guarda a qué semana pertenecen los datos que hay en pantalla, para
  // no guardar por error los datos de una semana en la clave de otra.
  const loadedWeekRef = useRef(null);

  const today = new Date();
  const weekStart = addDays(getWeekStart(today), weekOffset * 7);
  const days = Array.from({ length: 7 }, (_, i) => addDays(weekStart, i));
  const weekKey = weekKeyFromStart(weekStart);
  const isCurrentWeek = weekOffset === 0;
  const isPastWeek = weekOffset < 0;
  // CORRECCIÓN: índice de hoy dentro de la semana, ahora que el día 0 es sábado
  const todayIndex = (today.getDay() + 1) % 7;
  const cajonActive = isCajonWeek(weekStart);
  // Días ya terminados (antes de hoy) y días que ya han "llegado" (incluido hoy).
  const pastDays = isPastWeek ? 7 : isCurrentWeek ? todayIndex : 0;
  const arrivedCount = isPastWeek ? 7 : isCurrentWeek ? todayIndex + 1 : 0;

  useEffect(() => {
    (async () => {
      try {
        const res = await window.storage.get('settings:pin', true);
        if (res) setStoredPin(res.value);
      } catch (e) {
        // aun no hay pin creado
      } finally {
        setPinLoaded(true);
      }
    })();
  }, []);

  // CARGA: al cambiar de semana, marca que aún no hay datos válidos y carga los de la semana nueva
  useEffect(() => {
    const token = ++loadTokenRef.current;
    loadedWeekRef.current = null;
    setWeekData(null);
    setConfirmReset(false);
    (async () => {
      try {
        const res = await window.storage.get(`week:${weekKey}`, true);
        if (loadTokenRef.current !== token) return;
        loadedWeekRef.current = weekKey;
        setWeekData(res ? normalizeWeekData(JSON.parse(res.value), pastDays) : emptyWeekData());
      } catch (e) {
        if (loadTokenRef.current !== token) return;
        loadedWeekRef.current = weekKey;
        setWeekData(emptyWeekData());
      }
    })();
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [weekKey]);

  // GUARDADO: solo si los datos en pantalla pertenecen a la semana que se está viendo
  useEffect(() => {
    if (weekData === null || loadedWeekRef.current !== weekKey) return;
    (async () => {
      try {
        await window.storage.set(`week:${weekKey}`, JSON.stringify(weekData), true);
      } catch (e) {
        console.error('No se pudo guardar la semana', e);
      }
    })();
  }, [weekData, weekKey]);

  const goHijaMode = () => {
    setMode('hija');
    setPinStage(null);
    setPinValue('');
    setPinValue2('');
    setPinError('');
  };

  const requestPadreMode = () => {
    if (mode === 'padre') return;
    setPinError('');
    setPinValue('');
    setPinValue2('');
    setPinStage(storedPin ? 'enter' : 'create');
  };

  const submitCreatePin = async () => {
    if (!/^\d{4}$/.test(pinValue)) {
      setPinError('El PIN debe tener 4 números');
      return;
    }
    if (pinValue !== pinValue2) {
      setPinError('Los dos PIN no coinciden');
      return;
    }
    try {
      await window.storage.set('settings:pin', pinValue, true);
      setStoredPin(pinValue);
      setMode('padre');
      setPinStage(null);
    } catch (e) {
      setPinError('No se pudo guardar el PIN, prueba de nuevo');
    }
  };

  const submitEnterPin = () => {
    if (pinValue === storedPin) {
      setMode('padre');
      setPinStage(null);
    } else {
      setPinError('PIN incorrecto');
      setPinValue('');
    }
  };

  if (!weekData || !pinLoaded) {
    return (
      <div className="gt-app">
        <style>{STYLES}</style>
        <div className="gt-loading">Cargando la semana…</div>
      </div>
    );
  }

  const field = mode === 'hija' ? 'proposed' : 'confirmed';

  // CORRECCIÓN: cama y ropa. Solo el modo padre puede marcar/quitar un fallo,
  // y solo en días que ya han llegado.
  const toggleFail = (key, i) => {
    if (mode !== 'padre' || i >= arrivedCount) return;
    setWeekData((prev) => {
      const arr = [...prev[key]];
      arr[i] = !arr[i];
      return { ...prev, [key]: arr };
    });
  };

  const toggleCuarto = () => {
    setWeekData((prev) => ({ ...prev, cuarto: { ...prev.cuarto, [field]: !prev.cuarto[field] } }));
  };

  const toggleCajon = () => {
    setWeekData((prev) => ({ ...prev, cajon: { ...prev.cajon, [field]: !prev.cajon[field] } }));
  };

  const toggleExtra = (key, i) => {
    setWeekData((prev) => {
      const task = prev.extras[key];
      const arr = [...task[field]];
      arr[i] = !arr[i];
      return { ...prev, extras: { ...prev.extras, [key]: { ...task, [field]: arr } } };
    });
  };

  const addAviso = (delta) => {
    setWeekData((prev) => ({ ...prev, avisosLavavajillas: Math.max(0, prev.avisosLavavajillas + delta) }));
  };

  // CORRECCIÓN: la tarea libre ya no suma puntos directamente. En modo
  // hija solo mueve el contador "propuesto" (una promesa, no cuenta para
  // el bono); en modo padre mueve el contador "confirmado", que es el
  // único que suma puntos. Así Irene no puede darse puntos ella sola.
  const addLibre = (delta) => {
    setWeekData((prev) => ({
      ...prev,
      extras: {
        ...prev.extras,
        libre: { ...prev.extras.libre, [field]: Math.max(0, prev.extras.libre[field] + delta) },
      },
    }));
  };

  const resetWeek = () => {
    setWeekData(emptyWeekData());
    setConfirmReset(false);
  };

  const failCount = (fails) => fails.reduce((sum, v, i) => sum + (i < arrivedCount && v ? 1 : 0), 0);

  const camaFails = failCount(weekData.camaFail);
  const ropaFails = failCount(weekData.ropaFail);
  const lavaFails = weekData.avisosLavavajillas;
  const camaFailed = camaFails >= FAIL_LIMIT;
  const ropaFailed = ropaFails >= FAIL_LIMIT;
  const lavaFailed = lavaFails >= AVISOS_LIMIT;
  const cuartoFailed = isPastWeek && !weekData.cuarto.confirmed;
  const cuartoPending = !weekData.cuarto.confirmed && !cuartoFailed;
  const cajonFailed = cajonActive && isPastWeek && !weekData.cajon.confirmed;
  const cajonPending = cajonActive && !weekData.cajon.confirmed && !cajonFailed;

  const basePayOk = !camaFailed && !ropaFailed && !lavaFailed && !cuartoFailed && !cajonFailed;
  const baseEarned = basePayOk ? BASE_PAY : 0;

  const camaConfirmed = Math.max(0, arrivedCount - camaFails);
  const ropaConfirmed = Math.max(0, arrivedCount - ropaFails);

  const extraConfirmedCount = (key) => weekData.extras[key].confirmed.filter(Boolean).length;
  // CORRECCIÓN: la tarea libre ahora suma con su contador "confirmado", no el número directo
  const extraPoints =
    EXTRA_TASKS.reduce((s, t) => s + extraConfirmedCount(t.key) * t.points, 0) + weekData.extras.libre.confirmed * 1;
  const extraBonus = extraPoints >= EXTRA_GOAL ? EXTRA_BONUS : 0;
  const total = baseEarned + extraBonus;
  const pointsPct = Math.min(100, (extraPoints / EXTRA_GOAL) * 100);

  const obligConfirmed = camaConfirmed + ropaConfirmed + (weekData.cuarto.confirmed ? 1 : 0);
  const xpPct = Math.round((obligConfirmed / 15) * 50) + Math.round(Math.min(1, extraPoints / EXTRA_GOAL) * 50);

  // CORRECCIÓN: cuántas propuestas de tarea libre están aún sin confirmar por el padre
  const librePending = Math.max(0, weekData.extras.libre.proposed - weekData.extras.libre.confirmed);

  return (
    <div className="gt-app">
      <style>{STYLES}</style>

      <header className="gt-header">
        <div className="gt-header__title">
          <div className="gt-trophy"><Trophy size={20} strokeWidth={2} /></div>
          <div>
            <div className="gt-name">Tareas de {PLAYER_NAME}</div>
          </div>
        </div>

        <div className="gt-week-nav">
          <button className="gt-nav-btn" onClick={() => setWeekOffset((w) => w - 1)} aria-label="Semana anterior">
            <ChevronLeft size={18} />
          </button>
          <div className="gt-week-label">
            <span>{formatShort(days[0])} – {formatShort(days[6])}</span>
            {isCurrentWeek && <span className="gt-badge">en curso</span>}
          </div>
          <button className="gt-nav-btn" onClick={() => setWeekOffset((w) => w + 1)} aria-label="Semana siguiente">
            <ChevronRight size={18} />
          </button>
        </div>
      </header>

      <div className="gt-xp">
        <div className="gt-xp__labels">
          <span>Progreso de la semana</span>
          <span className="gt-mono">{xpPct}%</span>
        </div>
        <div className="gt-xp__track">
          <div className="gt-xp__fill" style={{ width: `${xpPct}%` }} />
        </div>
      </div>

      {pinStage === null ? (
        <div className="gt-mode">
          <button
            className={`gt-mode__btn ${mode === 'hija' ? 'gt-mode__btn--active' : ''}`}
            onClick={goHijaMode}
          >
            <User size={15} /> Modo hija
          </button>
          <button
            className={`gt-mode__btn ${mode === 'padre' ? 'gt-mode__btn--active' : ''}`}
            onClick={requestPadreMode}
          >
            <ShieldCheck size={15} /> Modo padre
          </button>
        </div>
      ) : (
        <div className="gt-pin">
          <div className="gt-pin__title"><Lock size={14} /> {pinStage === 'create' ? 'Crea el PIN del modo padre' : 'Introduce el PIN del modo padre'}</div>
          {pinStage === 'create' ? (
            <>
              <input
                className="gt-pin__input"
                type="password"
                inputMode="numeric"
                maxLength={4}
                placeholder="PIN de 4 números"
                value={pinValue}
                onChange={(e) => setPinValue(e.target.value.replace(/\D/g, ''))}
              />
              <input
                className="gt-pin__input"
                type="password"
                inputMode="numeric"
                maxLength={4}
                placeholder="Repite el PIN"
                value={pinValue2}
                onChange={(e) => setPinValue2(e.target.value.replace(/\D/g, ''))}
              />
              <div className="gt-pin__actions">
                <button className="gt-pin__ok" onClick={submitCreatePin}>Guardar PIN</button>
                <button className="gt-pin__cancel" onClick={goHijaMode}>Cancelar</button>
              </div>
            </>
          ) : (
            <>
              <input
                className="gt-pin__input"
                type="password"
                inputMode="numeric"
                maxLength={4}
                placeholder="PIN"
                value={pinValue}
                onChange={(e) => setPinValue(e.target.value.replace(/\D/g, ''))}
                onKeyDown={(e) => e.key === 'Enter' && submitEnterPin()}
                autoFocus
              />
              <div className="gt-pin__actions">
                <button className="gt-pin__ok" onClick={submitEnterPin}>Entrar</button>
                <button className="gt-pin__cancel" onClick={goHijaMode}>Cancelar</button>
              </div>
            </>
          )}
          {pinError && <div className="gt-pin__error">{pinError}</div>}
        </div>
      )}

      <div className="gt-grid">
        {/* TAREA BASE */}
        <section className="gt-panel">
          <h2 className="gt-panel__title">Tareas base <span className="gt-panel__amount">{BASE_PAY.toFixed(2)} €</span></h2>
          <p className="gt-panel__hint">Cama y ropa cuentan como hechas cada día; solo el modo padre puede quitarlas. 2 fallos permitidos por tarea, 4 avisos. El cuarto y el cajón del baño no tienen margen.</p>

          <AutoTaskRow
            label="Hacer la cama"
            sub="L-V antes del insti · S-D antes de las 12h"
            days={days}
            fails={weekData.camaFail}
            arrivedCount={arrivedCount}
            canEdit={mode === 'padre'}
            onToggle={(i) => toggleFail('camaFail', i)}
          />
          <Lives failCount={camaFails} limit={FAIL_LIMIT} />

          <AutoTaskRow
            label="Ropa sucia al cesto"
            sub="L-V antes del insti · S-D antes de las 12h"
            days={days}
            fails={weekData.ropaFail}
            arrivedCount={arrivedCount}
            canEdit={mode === 'padre'}
            onToggle={(i) => toggleFail('ropaFail', i)}
          />
          <Lives failCount={ropaFails} limit={FAIL_LIMIT} />

          <div className="gt-weekly">
            <div>
              <div className="gt-weekly__label">Limpiar y ordenar su cuarto</div>
              <div className="gt-panel__sub">ropa doblada en armario, mesa de estudio, barrer y fregar</div>
            </div>
            <Cell
              proposed={weekData.cuarto.proposed}
              confirmed={weekData.cuarto.confirmed}
              onClick={toggleCuarto}
              ariaLabel="Cuarto ordenado esta semana"
              sublabel=""
            />
          </div>
          {cuartoFailed && (
            <div className="gt-warning"><AlertTriangle size={13} /> tarea fallida</div>
          )}
          {cuartoPending && !cuartoFailed && (
            <div className="gt-pending">pendiente esta semana</div>
          )}

          {cajonActive ? (
            <>
              <div className="gt-weekly">
                <div>
                  <div className="gt-weekly__label">Ordenar el cajón del baño</div>
                  <div className="gt-panel__sub">semana sí, semana no</div>
                </div>
                <Cell
                  proposed={weekData.cajon.proposed}
                  confirmed={weekData.cajon.confirmed}
                  onClick={toggleCajon}
                  ariaLabel="Cajón del baño ordenado esta semana"
                  sublabel=""
                />
              </div>
              {cajonFailed && (
                <div className="gt-warning"><AlertTriangle size={13} /> tarea fallida</div>
              )}
              {cajonPending && !cajonFailed && (
                <div className="gt-pending">pendiente esta semana</div>
              )}
            </>
          ) : (
            <div className="gt-pending">🗄️ Cajón del baño: esta semana no toca</div>
          )}

          <div className="gt-dish">
            <div>
              <div className="gt-weekly__label">Avisos del día a día</div>
              <div className="gt-panel__sub">lavavajillas sin guardar, zapatos/ropa en el salón, o baño desordenado</div>
            </div>
            <div className="gt-dish__controls">
              <button
                className="gt-round-btn"
                onClick={() => mode === 'padre' && addAviso(-1)}
                disabled={mode !== 'padre'}
                aria-label={mode === 'padre' ? 'Quitar un aviso' : 'Solo se puede quitar un aviso en modo padre'}
                title={mode === 'padre' ? undefined : 'Solo en modo padre'}
                style={mode !== 'padre' ? { opacity: 0.35, cursor: 'not-allowed' } : undefined}
              >
                <Minus size={14} />
              </button>
              <span className="gt-mono gt-dish__count">{weekData.avisosLavavajillas} aviso{weekData.avisosLavavajillas === 1 ? '' : 's'}</span>
              <button className="gt-round-btn gt-round-btn--warn" onClick={() => addAviso(1)} aria-label="Añadir un aviso"><Plus size={14} /></button>
            </div>
          </div>
          <Lives failCount={lavaFails} limit={AVISOS_LIMIT} />

          {!basePayOk && (
            <div className="gt-status gt-status--failed"><AlertTriangle size={14} /> paga base perdida esta semana</div>
          )}
          {basePayOk && isCurrentWeek && (
            <div className="gt-status gt-status--ok"><ShieldCheck size={14} /> paga base a salvo por ahora</div>
          )}
        </section>

        {/* MISIÓN EXTRA */}
        <section className="gt-panel gt-panel--extra">
          <h2 className="gt-panel__title">Tareas extra <span className="gt-panel__amount gt-panel__amount--gold">hasta {EXTRA_BONUS.toFixed(2)} €</span></h2>
          <p className="gt-panel__hint">Con {EXTRA_GOAL} puntos se desbloquea el bono completo, todo o nada.</p>

          {EXTRA_TASKS.map((t) => (
            <TaskRow
              key={t.key}
              label={t.label}
              sub={`+${t.points} pto${t.points !== 1 ? 's' : ''} cada vez`}
              days={days}
              task={weekData.extras[t.key]}
              onToggle={(i) => toggleExtra(t.key, i)}
            />
          ))}

          {/* CORRECCIÓN: la tarea libre ahora distingue "propuesto" (hija) de "confirmado" (padre) */}
          <div className="gt-dish">
            <div>
              <div className="gt-weekly__label"><Gift size={14} style={{ marginRight: 4, verticalAlign: -2 }} />Tarea extra (sin definir)</div>
              <div className="gt-panel__sub">
                +1 punto cada vez, solo cuenta cuando el padre la confirma
              </div>
            </div>
            <div className="gt-dish__controls">
              <button
                className="gt-round-btn"
                onClick={() => addLibre(-1)}
                aria-label={mode === 'padre' ? 'Quitar una confirmación' : 'Quitar una propuesta'}
              >
                <Minus size={14} />
              </button>
              <span className="gt-mono gt-dish__count">{weekData.extras.libre.confirmed}</span>
              <button
                className="gt-round-btn gt-round-btn--gold"
                onClick={() => addLibre(1)}
                aria-label={mode === 'padre' ? 'Confirmar una tarea sorpresa' : 'Proponer una tarea sorpresa'}
              >
                <Plus size={14} />
              </button>
            </div>
          </div>
          {mode === 'hija' && (
            <div className="gt-pending">
              {weekData.extras.libre.proposed} propuesta{weekData.extras.libre.proposed === 1 ? '' : 's'} — pendiente de que papá la confirme
            </div>
          )}
          {mode === 'padre' && librePending > 0 && (
            <div className="gt-pending">{librePending} propuesta{librePending === 1 ? '' : 's'} de Irene sin confirmar</div>
          )}

          <div className="gt-progress">
            <div className="gt-progress__labels">
              <span>Puntos esta semana</span>
              <span className="gt-mono">{extraPoints} / {EXTRA_GOAL}</span>
            </div>
            <div className="gt-progress__track">
              <div className="gt-progress__fill" style={{ width: `${pointsPct}%` }} />
            </div>
            {extraBonus > 0 && (
              <div className="gt-unlocked"><Sparkles size={14} /> ¡bono desbloqueado!</div>
            )}
          </div>
        </section>
      </div>

      <div className="gt-receipt">
        <div className="gt-receipt__title">Recibo de la semana</div>
        <div className="gt-receipt__row">
          <span>Paga base</span>
          <span className="gt-mono">{baseEarned.toFixed(2)} €</span>
        </div>
        <div className="gt-receipt__row">
          <span>Bono extra ({extraPoints}/{EXTRA_GOAL} pts)</span>
          <span className="gt-mono">{extraBonus.toFixed(2)} €</span>
        </div>
        <div className="gt-receipt__divider" />
        <div className="gt-receipt__row gt-receipt__row--total">
          <span>Total</span>
          <span className="gt-mono">{total.toFixed(2)} €</span>
        </div>
      </div>

      <div className="gt-footer">
        {!confirmReset ? (
          <button className="gt-reset-btn" onClick={() => setConfirmReset(true)}>
            <RotateCcw size={13} /> Reiniciar esta semana
          </button>
        ) : (
          <div className="gt-confirm">
            <span>¿Borrar todo lo marcado esta semana?</span>
            <button className="gt-confirm__yes" onClick={resetWeek}>Sí, borrar</button>
            <button className="gt-confirm__no" onClick={() => setConfirmReset(false)}>Cancelar</button>
          </div>
        )}
      </div>
    </div>
  );
}

// Casilla de cama/ropa: ✓ automático desde que llega el día, ✗ si el padre la quita.
function AutoCell({ state, onClick, disabled, ariaLabel, sublabel }) {
  const cls = state === 'done' ? 'confirmed' : state === 'failed' ? 'failed' : 'empty';
  return (
    <button
      type="button"
      onClick={onClick}
      disabled={disabled}
      aria-label={ariaLabel}
      className={`gt-cell gt-cell--${cls}`}
    >
      <span className="gt-cell__mark">
        {state === 'done' && <Check size={14} strokeWidth={3} />}
        {state === 'failed' && <X size={14} strokeWidth={3} />}
      </span>
      {state === 'future' && <span className="gt-cell__letter">{sublabel}</span>}
    </button>
  );
}

function AutoTaskRow({ label, sub, days, fails, arrivedCount, canEdit, onToggle }) {
  return (
    <div className="gt-task-row">
      <div className="gt-task-row__label">
        <div>{label}</div>
        {sub && <div className="gt-panel__sub">{sub}</div>}
      </div>
      <div className="gt-day-grid">
        {days.map((d, i) => {
          const arrived = i < arrivedCount;
          const state = !arrived ? 'future' : fails[i] ? 'failed' : 'done';
          const estado = state === 'failed' ? 'no cumplida' : state === 'done' ? 'cumplida' : 'pendiente';
          return (
            <AutoCell
              key={i}
              state={state}
              disabled={!canEdit || !arrived}
              onClick={() => onToggle(i)}
              ariaLabel={`${label} — ${DAY_FULL[i]} ${d.getDate()}: ${estado}`}
              sublabel={DAY_LETTERS[i]}
            />
          );
        })}
      </div>
    </div>
  );
}

function TaskRow({ label, sub, days, task, onToggle }) {
  return (
    <div className="gt-task-row">
      <div className="gt-task-row__label">
        <div>{label}</div>
        {sub && <div className="gt-panel__sub">{sub}</div>}
      </div>
      <div className="gt-day-grid">
        {days.map((d, i) => (
          <Cell
            key={i}
            proposed={task.proposed[i]}
            confirmed={task.confirmed[i]}
            onClick={() => onToggle(i)}
            ariaLabel={`${label} — ${DAY_FULL[i]} ${d.getDate()}`}
            sublabel={DAY_LETTERS[i]}
          />
        ))}
      </div>
    </div>
  );
}

.gt-progress { margin-top: 10px; }
.gt-progress__labels { display: flex; justify-content: space-between; font-size: 11.5px; color: var(--text-dim); margin-bottom: 6px; }
.gt-progress__track { height: 8px; border-radius: 6px; background: rgba(255,255,255,0.08); overflow: hidden; }
.gt-progress__fill { height: 100%; background: var(--gold); transition: width 0.25s ease; }
.gt-unlocked { display: flex; align-items: center; gap: 5px; margin-top: 8px; font-size: 12px; font-weight: 700; color: var(--gold); }

.gt-mono { font-family: 'JetBrains Mono', monospace; font-variant-numeric: tabular-nums; }

.gt-receipt { background: var(--panel); border: 1px dashed var(--border); border-radius: 10px; margin: 14px 4px 4px 4px; padding: 16px 18px; font-family: 'JetBrains Mono', monospace; font-size: 12.5px; }
.gt-receipt__title { font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--text-dim); margin-bottom: 10px; }
.gt-receipt__row { display: flex; justify-content: space-between; padding: 3px 0; }
.gt-receipt__divider { border-top: 1px dashed var(--border); margin: 6px 0; }
.gt-receipt__row--total { font-size: 15px; font-weight: 700; color: var(--gold); }

.gt-footer { display: flex; justify-content: center; padding: 12px 4px 2px 4px; }
.gt-reset-btn { display: flex; align-items: center; gap: 6px; background: transparent; border: none; color: var(--text-dim); font-size: 11.5px; cursor: pointer; padding: 4px; }
.gt-reset-btn:hover { color: var(--text); }
.gt-confirm { display: flex; align-items: center; gap: 10px; font-size: 12px; flex-wrap: wrap; justify-content: center; }
.gt-confirm__yes { background: var(--red); color: #fff; border: none; border-radius: 6px; padding: 5px 10px; cursor: pointer; font-size: 11.5px; }
.gt-confirm__no { background: transparent; border: 1px solid var(--border); color: var(--text); border-radius: 6px; padding: 5px 10px; cursor: pointer; font-size: 11.5px; }

@import url('https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap');
`;

// =====================================================================
function App() {
  if (dbError === "CONFIG_MISSING") {
    return (
      <div style={{ fontFamily: "monospace", color: "#F3EEFF", background: "#241640", border: "1px solid #7C5CFC", borderRadius: 14, padding: 24, maxWidth: 640, margin: "40px auto", lineHeight: 1.6 }}>
        ⚠️ Falta configurar Firebase.<br/><br/>
        Abre <b>index.html</b>, busca <b>FIREBASE_CONFIG</b> al principio del archivo
        y pega ahí los datos de tu proyecto de Firebase (lo explica el README.md).
      </div>
    );
  }
  if (dbError) {
    return (
      <div style={{ fontFamily: "monospace", color: "#F3EEFF", background: "#241640", border: "1px solid #FF5470", borderRadius: 14, padding: 24, maxWidth: 640, margin: "40px auto", lineHeight: 1.6 }}>
        ⚠️ No se pudo conectar con Firebase: {dbError}
      </div>
    );
  }
  return <BancoDeMisiones />;
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
